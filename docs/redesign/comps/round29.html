<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Round 29: accent</title>
<style>
body{margin:0;font-family:ui-sans-serif,system-ui,sans-serif;background:#f1f3f5;color:#161b22;line-height:1.5;padding:2rem clamp(1rem,4vw,3rem)}
h1{font-size:1.5rem;margin:0 0 .4rem}
p{max-width:72ch;color:#51565c;margin:0 0 1.5rem}
a{color:#1f53b8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(32rem,1fr));gap:1rem}
figure{margin:0;background:#fff;border-radius:8px;padding:.6rem}
figcaption{font-family:ui-monospace,monospace;font-size:.8rem;color:#51565c;margin-bottom:.4rem}
figcaption b{color:#161b22}
img{display:block;width:100%;height:auto;border-radius:4px}
</style>
</head>
<body>
<h1>Round 29: the accent, six ways</h1>
<p>Same lightness and saturation profile, only the hue changes, and every one passes contrast for text in both themes. None sits near the status colours (green, amber, red). Live: <a href="hero-line.html">hero-line.html</a> (accent switch) and <a href="system.html">system.html</a> (swatches top right).</p>
<div class="grid">
<script>
for (const [k, d] of [['blue','262 · today'],['indigo','278 · Linear-like'],['violet','298 · Stripe-like'],['magenta','340'],['sky','235 · cooler, calmer'],['teal','195']])
  for (const t of ['', '-dark']) document.write(`<figure><figcaption><b>${k}</b> · hue ${d}${t ? ' · dark' : ''}</figcaption><img src="/shots/39-accent-${k}${t}.png" alt=""></figure>`);
</script>
</div>
</body>
</html>

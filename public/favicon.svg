<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <!-- Before → after: every post's headline result as a mark, a long grey bar
         over a short purple one, on the page colour. Dark (the site's default)
         unless the browser chrome is light. Values from src/styles/scales.css:
         n1, n8 and v6 dark; n3, n8 and v4 light. -->
    <style>
        .tile { fill: #f1f3f5; }
        .was { fill: #adb1b7; }
        .now { fill: #7d39ac; }
        @media (prefers-color-scheme: dark) {
            .tile { fill: #0c0d0f; }
            .was { fill: #575b60; }
            .now { fill: #b55df5; }
        }
    </style>
    <rect class="tile" width="128" height="128" rx="24" />
    <rect class="was" x="26" y="40" width="76" height="18" rx="5" />
    <rect class="now" x="26" y="70" width="30" height="18" rx="5" />
</svg>

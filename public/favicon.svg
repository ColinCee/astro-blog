<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <!-- Stone and tomato, or the dark theme's colours when the system is dark (src/styles/terminal.css). -->
    <style>
        .tile { fill: #e2dfda; }
        .mark { fill: #c8331a; stroke: #c8331a; }
        @media (prefers-color-scheme: dark) {
            .tile { fill: #110e09; }
            .mark { fill: #ff8259; stroke: #ff8259; }
        }
    </style>
    <rect class="tile" width="128" height="128" rx="24" />
    <path class="mark" d="M34 40 L56 64 L34 88" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" style="fill: none" />
    <rect class="mark" x="62" y="79" width="30" height="11" rx="5.5" stroke="none" style="stroke: none" />
</svg>

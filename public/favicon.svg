<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
    <!-- The prompt mark in the accent on the page colour: dark (the site's default) unless
         the browser chrome is light. Values from src/styles/scales.css: n1 and v6 dark,
         n3 and v4 light. -->
    <style>
        .tile { fill: #f1f3f5; }
        .mark { fill: #7d39ac; stroke: #7d39ac; }
        @media (prefers-color-scheme: dark) {
            .tile { fill: #0c0d0f; }
            .mark { fill: #b55df5; stroke: #b55df5; }
        }
    </style>
    <rect class="tile" width="128" height="128" rx="24" />
    <path class="mark" d="M34 40 L56 64 L34 88" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" style="fill: none" />
    <rect class="mark" x="62" y="79" width="30" height="11" rx="5.5" stroke="none" style="stroke: none" />
</svg>

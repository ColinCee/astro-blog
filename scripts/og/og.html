<!doctype html>
<!-- The link-preview image (public/og.png): the homepage hero in the dark theme.
     Rendered at 1200x630 by scripts/og/render.mjs; colours are the dark tokens in
     src/styles/terminal.css, so change them there first. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;700&display=block"
    />
    <style>
      :root {
        --bg: oklch(0.165 0.012 80);
        --line: oklch(0.31 0.018 80);
        --ink: oklch(0.95 0.01 95);
        --muted: oklch(0.72 0.02 95);
        --faint: oklch(0.63 0.02 95);
        --accent: oklch(0.75 0.17 38);
        --grotesk: "Bricolage Grotesque", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 64px 80px 56px;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        /* The hero's faint dot grid, fading out downwards, and its tomato bloom. */
        background:
          radial-gradient(60% 70% at 88% 6%, color-mix(in oklch, var(--accent) 14%, transparent), transparent 70%),
          var(--bg);
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, color-mix(in oklch, var(--ink) 16%, transparent) 1.2px, transparent 1.7px);
        background-size: 28px 28px;
        mask-image: linear-gradient(#000 20%, transparent 85%);
      }
      .card > * {
        position: relative;
      }
      .mark {
        font-family: var(--mono);
        font-size: 30px;
        letter-spacing: -0.01em;
      }
      .mark span {
        color: var(--accent);
      }
      .mark b {
        color: var(--faint);
        font-weight: 400;
      }
      .eyebrow {
        margin: auto 0 18px;
        font-family: var(--mono);
        font-size: 22px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .name {
        margin: 0;
        font-family: var(--grotesk);
        font-weight: 800;
        font-size: 152px;
        line-height: 0.86;
        letter-spacing: -0.025em;
      }
      .who {
        margin: 34px 0 0;
        font-family: var(--mono);
        font-size: 27px;
        color: var(--muted);
      }
      .who span {
        color: var(--accent);
      }
      .foot {
        display: flex;
        justify-content: space-between;
        margin-top: 46px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 22px;
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">colin<span>@</span>glasgow<b>:~$</b></div>
      <p class="eyebrow">Senior Software Engineer</p>
      <h1 class="name">COLIN CHEUNG</h1>
      <p class="who"><span>$</span> whoami · tech lead at EDF Energy, leading AI adoption</p>
      <div class="foot"><span>colincheung.dev</span><span>TypeScript · Node · AWS · AI</span></div>
    </div>
  </body>
</html>

<!doctype html>
<!-- The link-preview image (public/og.png): the homepage hero in the dark theme (the
     site's default, and how Discord and most chat apps show previews). Rendered at
     1200x630 by scripts/og/render.ts. Colours are the dark values in
     src/styles/scales.css (generated by docs/redesign/comps/tokens.mts); fonts as
     the site: Sora for the name and the one-liner, Geist for the role, DM Mono. -->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400&family=Sora:wght@200;300;600&family=DM+Mono:wght@400&display=block"
    >
    <style>
      :root {
        --bg: #0c0d0f;
        --ink: #e8eff9;
        --muted: #b2b8bf;
        --faint: #a0a5ac;
        --accent: #b55df5;
        --line: color-mix(in oklab, var(--ink) 10%, transparent);
        --head: "Sora", sans-serif;
        --grotesk: "Geist", sans-serif;
        --mono: "DM Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
      }
      .card {
        width: 1200px;
        height: 630px;
        padding: 64px 80px 56px;
        display: flex;
        flex-direction: column;
        color: var(--ink);
      }
      .mark {
        font-family: var(--mono);
        font-size: 26px;
      }
      .mark b {
        color: var(--faint);
        font-weight: 400;
      }
      .name {
        margin: auto 0 0;
        font-family: var(--head);
        font-weight: 600;
        font-size: 132px;
        line-height: 1;
        letter-spacing: -0.05em;
      }
      .role {
        margin: 18px 0 0;
        font-family: var(--grotesk);
        font-size: 30px;
        color: var(--muted);
      }
      /* One of the homepage's one-liners: Sora 200, its punchline the one
         thing in the accent, at 300. */
      .quip {
        margin: 40px 0 0;
        font-family: var(--head);
        font-weight: 200;
        font-size: 40px;
        letter-spacing: -0.03em;
      }
      .quip b {
        font-weight: 300;
        color: var(--accent);
      }
      .foot {
        margin-top: 44px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 22px;
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">colin@glasgow<b>:~$</b></div>
      <h1 class="name">Colin Cheung</h1>
      <p class="role">Senior Software Engineer</p>
      <p class="quip"><b>claude</b> implement this, make no mistakes.</p>
      <div class="foot">colincheung.dev</div>
    </div>
  </body>
</html>

<!doctype html>
<!-- The link-preview image (public/og.png): the homepage hero in the Stone (light)
     theme. Rendered at 1200x630 by scripts/og/render.mjs; colours are the light tokens
     in src/styles/terminal.css, and the claims come from the CV page. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;500;700&display=block"
    />
    <style>
      :root {
        --bg: oklch(0.905 0.008 85);
        --line: oklch(0.82 0.011 85);
        --ink: oklch(0.22 0.012 85);
        --muted: oklch(0.42 0.013 85);
        --faint: oklch(0.49 0.013 85);
        --accent: oklch(0.55 0.19 32);
        --accent-soft: oklch(0.49 0.17 32);
        --grotesk: "Bricolage Grotesque", sans-serif;
        --mono: "JetBrains Mono", monospace;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 64px 80px 56px;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        /* The hero's faint dot grid, fading out downwards, and its tomato bloom. */
        background:
          radial-gradient(60% 70% at 88% 6%, color-mix(in oklch, var(--accent) 10%, transparent), transparent 70%),
          var(--bg);
      }
      .card::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(circle, color-mix(in oklch, var(--ink) 16%, transparent) 1.2px, transparent 1.7px);
        background-size: 28px 28px;
        mask-image: linear-gradient(#000 20%, transparent 85%);
      }
      .card > * {
        position: relative;
      }
      .mark {
        font-family: var(--mono);
        font-size: 30px;
        letter-spacing: -0.01em;
      }
      .mark span {
        color: var(--accent);
      }
      .mark b {
        color: var(--faint);
        font-weight: 400;
      }
      .eyebrow {
        margin: auto 0 18px;
        font-family: var(--mono);
        font-size: 22px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .name {
        margin: 0;
        font-family: var(--grotesk);
        font-weight: 800;
        font-size: 152px;
        line-height: 0.86;
        letter-spacing: -0.025em;
      }
      .who {
        margin: 34px 0 0;
        display: grid;
        grid-template-columns: auto auto 1fr;
        gap: 10px 16px;
        font-family: var(--mono);
        font-size: 25px;
        color: var(--muted);
      }
      .who i {
        font-style: normal;
        color: var(--accent);
      }
      .who em {
        font-style: normal;
        color: var(--ink);
      }
      .who b {
        font-weight: 700;
        color: var(--accent-soft);
      }
      .foot {
        display: flex;
        justify-content: space-between;
        margin-top: 46px;
        padding-top: 22px;
        border-top: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 22px;
        color: var(--faint);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">colin<span>@</span>glasgow<b>:~$</b></div>
      <p class="eyebrow">Senior Software Engineer</p>
      <h1 class="name">COLIN CHEUNG</h1>
      <div class="who">
        <i>$</i><em>whoami</em><span>tech lead, EDF Energy's debt platform: <b>1.6M accounts a day</b></span>
        <i>$</i><em>shipped</em><span>CI <b>30 → 5 min</b> · same project, <b>half the team, half the time</b></span>
      </div>
      <div class="foot"><span>colincheung.dev</span><span>9 years · TypeScript · Node · AWS</span></div>
    </div>
  </body>
</html>
